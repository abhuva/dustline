[project]
site_name = "Dustline"
site_url = "https://abhuva.github.io/dustline/"
site_description = "An original driving and combat RPG for the Game Boy Advance."
site_author = "Marc Bielert"
copyright = "Dustline by Marc Bielert · CC BY-SA 4.0"
repo_url = "https://github.com/abhuva/Dustline"
repo_name = "abhuva/Dustline"
edit_uri = "edit/main/docs/"
extra_css = ["stylesheets/extra.css"]

nav = [
  { "Home" = "index.md" },
  { "The game" = "game.md" },
  { "Play" = "play.md" },
  { "Development" = "development.md" },
  { "Workshops" = "workshops.md" },
]

[project.theme]
language = "en"
logo = "images/title.png"
favicon = "images/favicon.png"
features = [
  "content.action.edit",
  "content.action.view",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "custom"
toggle.icon = "lucide/moon"
toggle.name = "Switch to light mode"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/abhuva/Dustline"
name = "Dustline on GitHub"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.line_spans = "__span"
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
